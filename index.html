<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Smart ফ্লিপকার্ড</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--card:#fff;--ink:#14213d;--mute:#5b6b85;--back:#0f3d3e;--backink:#eafaf7;--acc:#f2b134;--accink:#3a2a00;--chip:#d9f0ea;--chipink:#0b3b35;--achip:#fbe3df;--achipink:#6b1d14;--line:#cfd8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1220;--card:#18223a;--ink:#eef2fb;--mute:#9db0cf;--back:#0e2f31;--backink:#e6f7f3;--line:#2a3857;--chip:#14423c;--chipink:#c9f2e8;--achip:#4a2420;--achipink:#ffd3cc}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1220;--card:#18223a;--ink:#eef2fb;--mute:#9db0cf;--back:#0e2f31;--backink:#e6f7f3;--line:#2a3857;--chip:#14423c;--chipink:#c9f2e8;--achip:#4a2420;--achipink:#ffd3cc}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:1.05rem;margin:0;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin:6px 2px 12px}
.scene{perspective:1200px}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);outline-offset:4px;border-radius:22px}
.card.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px 20px;min-height:430px}
.front{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.word{font-family:Fraunces,Georgia,serif;font-size:clamp(2.2rem,11vw,3.2rem);font-weight:600;letter-spacing:-.01em;word-break:break-word}
.pos{color:var(--mute);font-size:.95rem}
.hint{margin-top:26px;color:var(--mute);font-size:.85rem}
.back{background:var(--back);color:var(--backink);transform:rotateY(180deg);display:flex;flex-direction:column;gap:12px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bh b{font-family:Fraunces,Georgia,serif;font-size:1.3rem}
.bn{font-size:1.45rem;font-weight:700;color:var(--acc);line-height:1.3}
.mn{background:var(--acc);color:var(--accink);border-radius:14px;padding:11px 13px;font-size:1rem;line-height:1.55}
.mn small{display:block;font-weight:700;margin-bottom:2px;opacity:.75}
.row small{display:block;opacity:.7;margin-bottom:4px;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);color:var(--chipink);border-radius:99px;padding:3px 11px;font-size:.88rem}
.chips.a span{background:var(--achip);color:var(--achipink)}
.rt{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.35);border-radius:14px;padding:10px 13px;line-height:1.5;font-size:.95rem}.rt small{display:block;opacity:.7;font-size:.8rem;margin-bottom:2px}.rt .chips{margin-top:7px}.rt .chips span{background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit}
.ex{border-left:3px solid var(--acc);padding-left:11px;font-size:1rem;line-height:1.5;font-family:Georgia,serif}
.ex em{font-style:normal;font-weight:700;color:var(--acc)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ctl button,.nav button{font:inherit;font-weight:500;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;cursor:pointer;font-size:1rem}
.ctl .ok{background:#1f8a5b;color:#fff;border-color:#1f8a5b}
.ctl .no{background:#c4442f;color:#fff;border-color:#c4442f}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.empty{text-align:center;padding:60px 10px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Word Smart · ফ্লিপকার্ড</h1>
    <div class="tabs" role="group" aria-label="ফিল্টার">
      <button id="tAll" aria-pressed="true">সব</button>
      <button id="tRev" aria-pressed="false">আবার দেখবো</button>
    </div>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="cnt"></span><span id="known"></span></div>
  <div id="stage"></div>
  <div class="ctl">
    <button class="no" id="bNo">↻ আবার দেখবো</button>
    <button class="ok" id="bOk">✓ মনে আছে</button>
  </div>
  <div class="nav">
    <button id="bPrev">← আগে</button>
    <button id="bShuf">শাফল</button>
    <button id="bNext">পরে →</button>
  </div>
</main>
<script>
const RAW=`ABSTRUSE|adjective|দুর্বোধ্য, গূঢ়|“অ্যাবস্ট্রুস” শুনলেই মনে করো “আবার ট্রাই!” — এত কঠিন যে বারবার চেষ্টা করেও মাথার ওপর দিয়ে যায়।|complex,obscure,recondite,profound|simple,obvious,straightforward,easy|The scientist’s theories were so abstruse that most people could not understand them.|Latin abstrudere = ab- (দূরে) + trudere (ঠেলা) → ঠেলে দূরে লুকিয়ে রাখা|intrude,protrude,extrude
ABYSMAL|adjective|অতি জঘন্য, অতল|abyss = অতল খাদ। খাবারটা এত খারাপ যে যেন অতল খাদে পড়ে গেছে — “আবিস-মাল” মানে একদম বাজে মাল!|dreadful,terrible,awful,atrocious|perfect,excellent,productive|The food was abysmal, and no one at the party ate it.|Greek abyssos = a- (ছাড়া) + byssos (তলা) → তলাহীন|abyss
ACCOLADE|noun|প্রশংসা, সম্মাননা|“এ-কোল-দে” — কোলে তুলে নিয়ে সম্মান দেওয়া! মূল অর্থও গলা জড়িয়ে ধরা (collar)।|praise,honor,award,tribute|criticism,blame,disapproval|The scientist received an accolade for her discovery.|Latin ad- (দিকে) + collum (গলা) → গলা জড়িয়ে ধরা|collar
ACCOST|verb|অযাচিতভাবে কাছে গিয়ে কথা বলা|“এ-কস্ট” — পাশে এসে দাঁড়িয়ে কষ্ট দেয়! costa = পাঁজর/পাশ, তাই গায়ের পাশে গিয়ে জ্বালানো।|confront,address,challenge,buttonhole|avoid,ignore,dodge,evade|An aggressive salesman accosted people on the street.|Latin ad- (দিকে) + costa (পাঁজর, পাশ) → পাশে গিয়ে দাঁড়ানো|coast,costal
ACERBIC|adjective|তিক্ত, কটু (স্বাদে বা কথায়)|“এ-সার-বিক” — তেতো খেলে সারা মুখ বিকৃত হয়ে যায়। কথাও যদি এমন তেতো হয়, সেটাও acerbic।|harsh,bitter,sharp,sarcastic|kind,gentle,sweet,mild|The critic’s acerbic review left the director furious.|Latin acerbus ← acer (ধারালো, তেতো)|acid,acrid,acrimony,exacerbate
ACQUIESCE|verb|নীরবে মেনে নেওয়া|শব্দের ভেতরেই আছে quiet! “এক্কেবারে চুপ” থেকে মেনে নিলে সেটাই acquiesce।|comply,agree,submit,yield|protest,resist,object,disagree|They finally acquiesced to the new schedule.|Latin ad- + quiescere (বিশ্রাম নেওয়া, চুপ হওয়া) ← quies (শান্তি)|quiet,quiescent,requiem
ACRID|adjective|ঝাঁঝালো, তীব্র গন্ধযুক্ত|পোড়া গন্ধে যেমন চোখ জ্বলে আর কাশি আসে — “এক্রিড” = ঝাঁঝ। মূলে acer = ধারালো।|pungent,sharp,bitter,harsh|sweet,fragrant,mild|The room was filled with the acrid smell of smoke.|Latin acer (ধারালো, ঝাঁঝালো)|acid,acerbic,acrimony,acute
ACRIMONIOUS|adjective|তিক্ত, কলহপূর্ণ|Acrid (ঝাঁঝ) + মনি = মনের ঝাঁঝ! যে ঝগড়ায় মন তেতো হয়ে যায়, সেটাই acrimonious।|bitter,hostile,angry,harsh|friendly,amicable,pleasant,peaceful|The meeting ended in an acrimonious argument.|Latin acrimonia (তিক্ততা) ← acer (ধারালো)|acrid,acerbic,acid
ACUMEN|noun|তীক্ষ্ণ বুদ্ধি, বিচক্ষণতা|“এ-কিউ-মেন” = A-Q-men, যাদের IQ ধারালো! ব্যবসায়ী বুদ্ধি বোঝাতে খুব চলে।|insight,discernment,astuteness,shrewdness|dullness,ignorance,naivety,foolishness|Her strong business acumen helped the company grow.|Latin acuere (ধার দেওয়া) ← acus (সূঁচ)|acute,acupuncture,acuity
ACUTE|adjective|তীব্র, তীক্ষ্ণ|acu = সূঁচ (acupuncture মনে করো)। সূঁচের মতো ধারালো ব্যথা বা অনুভূতিই acute।|severe,sharp,keen,intense|mild,chronic,blunt,dull|A dog’s sense of smell is very acute.|Latin acutus ← acuere (ধার দেওয়া) ← acus (সূঁচ)|acumen,acupuncture,acuity
ADAMANT|adjective|অনড়, জেদি|“আদা-মন্ট” — আদা-জল খেয়ে লেগেছে! এমন মানুষকে কেউ নোয়াতে পারে না।|determined,resolute,unyielding,steadfast|flexible,yielding,compliant,submissive|He was adamant that he would win the competition.|Greek a- (না) + damaein (বশ করা) → অদম্য, অজেয়|adamantine,diamond
ADDRESS|noun & verb|ঠিকানা; সম্বোধন করা; (সমস্যা) মোকাবিলা করা|ঠিকানায় যেমন সোজা চিঠি যায়, তেমনি সোজা সমস্যার দিকে এগোলে সেটা address করা (ad + directus = সোজা)।|manage,deliver,communicate,tackle|neglect,ignore,avoid,disregard|She addressed the concerns with care.|Latin ad- (দিকে) + directus (সোজা) → সোজা করে নেওয়া|direct,direction,redress
ADHERENT|noun|অনুসারী, ভক্ত|adhesive = আঠা। আঠার মতো আদর্শের সাথে লেগে থাকে যে, সে-ই adherent।|follower,supporter,disciple|opponent,critic,rebel|He is a firm adherent of that philosophy.|Latin ad- (দিকে) + haerere (লেগে থাকা)|adhesive,cohere,inherent,hesitate
ADMONISH|verb|মৃদু ভর্ৎসনা করা, সতর্ক করা|“অ্যাড-মনি” ≈ মনিটর! ক্লাস মনিটর যেমন নরম সুরে সতর্ক করে।|scold,warn,reprimand,chide|praise,approve,encourage,commend|The teacher admonished the student for not doing his homework.|Latin ad- (দিকে) + monere (সতর্ক করা)|monitor,monument,premonition,summon
ADROIT|adjective|দক্ষ, পটু|ফরাসি droit = ডান। ডান হাত যার দক্ষ, সে adroit! উল্টো gauche = বাঁ হাতি আনাড়ি।|skillful,deft,adept,dexterous|inept,gauche,unskilled,awkward|The adroit chef chopped the vegetables in seconds.|French à droit (ডানদিকে) ← Latin directus (সোজা, ঠিক)|dexterity,ambidextrous
ADULATION|noun|অতি স্তুতি, চাটুকারিতা|“আ-দুলাল-শন” — কাউকে দুলালের মতো মাথায় তুলে নাচা! ভক্তদের হিরো-ওয়ারশিপ।|praise,worship,idolization,hero worship|contempt,scorn|The superstar enjoyed the adulation of the crowd.|Latin adulari (লেজ নাড়িয়ে তোষামোদ করা)|adulate
ADULTERATE|verb|ভেজাল মেশানো|“অ্যাডাল্ট-রেট” — দুধে জল মেশানোর মতো। ad + alter = অন্য কিছু মিশিয়ে মান নষ্ট করা।|contaminate,dilute,pollute|purify,refine,cleanse|Many expensive olive oils are adulterated with cheaper vegetable oils.|Latin ad- + alterare ← alter (অন্য) → অন্য কিছু মেশানো|alter,alternate,alternative
ADVERSE|adjective|প্রতিকূল, ক্ষতিকর|“অ্যাড-ভার্স” ≈ versus (ভার্সেস)! সব সময় বিপক্ষে দাঁড়িয়ে থাকে, তাই প্রতিকূল।|unfavorable,negative,hostile,harmful|favorable,positive,beneficial,helpful|Due to adverse weather, the picnic was cancelled.|Latin ad- (দিকে) + vertere (ঘোরা) → বিপক্ষে ঘুরে দাঁড়ানো|adversary,reverse,diverse,versatile
AESTHETIC|adjective|নান্দনিক, রুচিশীল|ক্যাফের সুন্দর ভাইব দেখে বলো “এস-থেটিক!” — চোখ জুড়ানো সৌন্দর্যবোধই aesthetic।|artistic,beautiful,tasteful|ugly,tasteless|She really liked the beautiful aesthetic of the cozy café.|Greek aisthetikos ← aisthanesthai (অনুভব করা)|anesthesia,synesthesia
AFFABLE|adjective|অমায়িক, মিশুক|“আফা-বল” — আপাকে (আফা) যেমন সহজে সবকিছু বলা যায়! মূলে: easy to speak to।|amiable,friendly,polite,kind|rude,unfriendly,discourteous,unsociable|The affable shopkeeper greeted every customer with a smile.|Latin ad- (দিকে) + fari (কথা বলা) → সহজে কথা বলা যায়|fable,fate,infant,ineffable`;
const W=RAW.split("\n").map(l=>{const p=l.split("|");return{w:p[0],pos:p[1],bn:p[2],mn:p[3],syn:p[4].split(","),ant:p[5].split(","),ex:p[6],rt:p[7],rel:p[8].split(",")}});
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("ws_known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("ws_known",JSON.stringify([...known]))}catch(e){}};
let mode="all",deck=[...W.keys()],pos=0,flip=false;
const $=id=>document.getElementById(id);
function chips(a,c){return`<div class="chips ${c}">`+a.map(x=>`<span>${x}</span>`).join("")+"</div>"}
function hi(ex,w){const s=w.toLowerCase().slice(0,5);return ex.replace(new RegExp("\\b("+s+"\\w*)","i"),"<em>$1</em>")}
function build(){deck=[...W.keys()].filter(i=>mode==="all"||!known.has(i));if(pos>=deck.length)pos=0;render()}
function render(){
  const st=$("stage");
  $("known").textContent="মনে আছে: "+known.size+"/"+W.length;
  $("pb").style.width=(known.size/W.length*100)+"%";
  if(!deck.length){st.innerHTML='<div class="empty">সব শব্দ মনে আছে! 🎉<br>“সব” ট্যাবে গিয়ে আবার দেখতে পারো।</div>';$("cnt").textContent="";return}
  const d=W[deck[pos]];flip=false;
  $("cnt").textContent="কার্ড "+(pos+1)+" / "+deck.length;
  st.innerHTML=`<div class="scene"><div class="card" id="cd" tabindex="0" role="button" aria-label="কার্ড উল্টাতে চাপো">
  <div class="face front"><div class="word">${d.w}</div><div class="pos">${d.pos}</div><div class="hint">অর্থ দেখতে কার্ডে ট্যাপ করো</div></div>
  <div class="face back">
   <div class="bh"><b>${d.w}</b><span>${d.pos}</span></div>
   <div class="bn">${d.bn}</div>
   <div class="mn"><small>মনে রাখার কৌশল</small>${d.mn}</div>
   <div class="rt"><small>শব্দের উৎস (Root)</small>${d.rt}<div class="chips">${d.rel.map(x=>`<span>${x}</span>`).join("")}</div></div>
   <div class="row"><small>Synonyms</small>${chips(d.syn,"")}</div>
   <div class="row"><small>Antonyms</small>${chips(d.ant,"a")}</div>
   <div class="ex">${hi(d.ex,d.w)}</div>
  </div></div></div>`;
  const cd=$("cd");cd.onclick=toggle;
  cd.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
}
function toggle(){const c=$("cd");if(!c)return;flip=!flip;c.classList.toggle("flip",flip)}
function go(n){if(!deck.length)return;pos=(pos+n+deck.length)%deck.length;render()}
function mark(ok){if(!deck.length)return;const i=deck[pos];if(ok)known.add(i);else known.delete(i);save();if(mode==="rev"&&ok){build()}else{go(1)}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;render()}
function tab(m){mode=m;pos=0;$("tAll").setAttribute("aria-pressed",m==="all");$("tRev").setAttribute("aria-pressed",m==="rev");build()}
$("bNext").onclick=()=>go(1);$("bPrev").onclick=()=>go(-1);$("bShuf").onclick=shuffle;
$("bOk").onclick=()=>mark(true);$("bNo").onclick=()=>mark(false);
$("tAll").onclick=()=>tab("all");$("tRev").onclick=()=>tab("rev");
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
build();
</script>
</body>
</html>
